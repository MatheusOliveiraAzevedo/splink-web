<section class="hero" aria-labelledby="hero-title">
  <div class="hero__media">
    <img src="assets/banner/familia.jpg" alt="Família sorrindo e usando celulares, tablet e notebook conectados à internet"
      width="960" height="780" fetchpriority="high">
  </div>

  <div class="hero__content">
    <img src="assets/logo/logo-color-splink.png" alt="SP-Link Telecom" class="hero__logo" width="1808" height="972">
    <h1 id="hero-title" class="hero__title">
      Internet <strong>rápida de verdade</strong> começa aqui.
    </h1>
    <p class="hero__subtitle">
      Estabilidade para suas <strong>maratonas</strong>, <strong>reuniões</strong> e <strong>jogos online</strong>,
      com atendimento que faz a diferença.
    </p>
    <button type="button" class="hero__cta" (click)="goToWhatsApp()">Quero contratar!</button>
    <a class="hero__coverage" href="#coverage-form">Consultar cobertura no meu endereço</a>
  </div>

  <img src="assets/banner/ondas-bottom.png" alt="" aria-hidden="true" class="hero__waves">
</section>
