<nav class="navbar navbar-expand-lg container-max px-4">
    <div class="container-fluid">
        <img class="image-logo cursor-pointer" src="assets/logo/logo-color-splink.webp" alt="Logo da SP Link" width="380" height="204" decoding="async" (click)="goHome()">
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menu de navegação">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="offcanvas offcanvas-start" style="width: 300px; height: 100vh;" id="navbarNav" aria-label="Menu principal" #offcanvasMenu>
            <div class="offcanvas-header">
                <img class="image-logo cursor-pointer" src="assets/logo/logo-color-splink.webp" alt="Logo da SP Link" width="380" height="204" decoding="async" (click)="goHome()" data-bs-dismiss="offcanvas" aria-label="Fechar menu">
                <button type="button" class="btn-close button-close" data-bs-dismiss="offcanvas" aria-label="Fechar menu"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="navbar-nav ms-auto fw-normal">
                    @for (menu of navBarMenu; track $index) {
                        <li class="nav-item {{menu.submenu ? 'dropdown' : ''}}">
                            @if (menu.submenu) {
                                <button type="button" class="nav-link dropdown-toggle cursor-pointer" data-bs-toggle="dropdown" aria-expanded="false">
                                    {{menu.label}}
                                  </button>
                                  <ul class="dropdown-menu dropdown-menu-end">
                                    @for (menuSub of menu.submenu; track $index) {
                                        <li><button type="button" class="dropdown-item" (click)="scrollTo(menuSub.scrollTo)" data-bs-dismiss="offcanvas">{{menuSub.label}}</button></li>
                                    }
                                  </ul>
                            } @else {
                                <button type="button" class="nav-link cursor-pointer" (click)="clickItemMenu(menu)" data-bs-dismiss="offcanvas">{{menu.label}}</button>
                            }
                        </li>
                    }
                </ul>
            </div>
        </div>
    </div>
</nav>
